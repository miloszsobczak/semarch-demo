name: semarch-demo

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      REDIS_URL: redis://redis:6379
      API_URL: http://api:3000
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
