name: semarch-demo

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      REDIS_URL: redis://redis:6379
      API_URL: http://api:3000
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  notifier:
    build:
      context: services/notifier
    environment:
      REDIS_URL: redis://redis:6379
      API_URL: http://api:3000
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  summary:
    build:
      context: services/summary
    environment:
      SUMMARY_ADDR: 0.0.0.0:8082
    ports:
      - "8082:8082"
    depends_on:
      notifier:
        condition: service_started
      api:
        condition: service_started

  triage:
    build:
      context: services/triage
    environment:
      TRIAGE_PORT: "8083"
    ports:
      - "8083:8083"
    depends_on:
      api:
        condition: service_started

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
