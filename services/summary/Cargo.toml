[package]
name = "ticket-summary"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.8.6"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net"] }
