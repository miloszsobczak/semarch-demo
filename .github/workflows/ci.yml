name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/triage/pom.xml
      - run: mvn -B -f services/triage/pom.xml verify
      - run: docker compose config --quiet
      - run: docker build -t semarch-demo-triage services/triage
